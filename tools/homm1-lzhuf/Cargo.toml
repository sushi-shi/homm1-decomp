[package]
name = "homm1-lzhuf"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Byte-exact reimplementation of the HoMM1 LZHUF save-transfer codec"

# Safe, dependency-free library; the binary is a thin file-level CLI.
[lib]
path = "src/lib.rs"

[[bin]]
name = "homm1-lzhuf"
path = "src/bin/homm1-lzhuf.rs"

# Buka 2003 build contract. Source/retail claim migration is in progress.
[build]
platform = "win32"
compiler = "vc6"

# Literal assertion paths recovered from the Buka executable.
[build.source_roots]
BASE = 'E:\Users\igorl\VSS\HMM\HMM1\Source\Base'
SOURCE = 'E:\Users\igorl\VSS\HMM\HMM1\Source\Game'

[flags]
# Unoptimized VC6 SP5 baseline. /Ob1 is directly measured in the Audiere
# routines; the remaining units still require individual retail comparison.
cpp_buka = ["/nologo", "/c", "/Od", "/Ob1", "/GX", "/MT", "/G6"]
# SAMPLE's full constructor (including switch tables) and destructor agree
# under /G5; /G6 inserts two extra short-argument register clears.
cpp_buka_g5 = ["/nologo", "/c", "/Od", "/Ob1", "/GX", "/MT", "/G5"]
# FINDPATH and SEARCH retain optimization; automatic inlining is proved by
# FindCombatPath containing the Clear and QuickDistance instruction bodies.
cpp_buka_o2_g5 = ["/nologo", "/c", "/O2", "/Ob2", "/GX", "/MT", "/G5"]
# REQUEST: retail places gFRDummy's "" between UpdateMapInfo's and ShowMapInfo's
# .bss literals (source order). /Ob1 emits file-scope initializer literals before
# every function literal; /Ob2 emits them in source order. Code is unchanged and
# all 13 REQUEST bodies are exact; KB regresses under /Ob2 (data-first order).
cpp_buka_ob2_g5 = ["/nologo", "/c", "/Od", "/Ob2", "/GX", "/MT", "/G5"]
# EDITOR.EXE's own objects expand string/memory intrinsics inline (/Oi): the
# editor's wingraph bodies equal this profile's compile of the game source.
cpp_editor_oi_g5 = ["/nologo", "/c", "/Od", "/Oi", "/Ob1", "/GX", "/MT", "/G5"]
cpp_editor_oi_ob2_g5 = ["/nologo", "/c", "/Od", "/Oi", "/Ob2", "/GX", "/MT", "/G5"]

# EDITOR.EXE (config/retail/targets.json `editor`) links the BASE library objects
# marked `images = ["game", "editor"]`: each of their bodies occurs byte-identically
# (relocations masked) in the editor (config/retail/editor/placements.tsv). The
# editor's objects were built from another checkout root, so its assertion paths
# differ and every shared unit compiles once per image.
[images.editor]
defines = ["HOMM1_EDITOR"]


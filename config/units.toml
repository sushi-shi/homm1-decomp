# Per-TU build contract, following Gruntz. See config/README.md.
[build]
platform = "win32"
compiler = "vc40"
compiler_status = "VC4.0 /Od compatible with AppAbout and PollSound fragments; historical compiler revision unconfirmed"

[flags]
cpp_od = ["/nologo", "/c", "/Od", "/Z7"]
# HoMM2 supplies declarations and ownership. HoMM1's exact PollSound family
# proves the free-function convention is the compiler default (/Gd), unlike
# the donor's /Gr build; reconstruction replaces these bodies in place.
cpp_carcass = ["/nologo", "/c", "/Od", "/Z7", "/G5", "/Ob1"]
# HISCORE::Open retail fs:[0] registration and new-window delete unwind prove /GX.
cpp_carcass_eh = ["/nologo", "/c", "/Od", "/Z7", "/G5", "/Ob1", "/GX"]
cpp_carcass_oi = ["/nologo", "/c", "/Od", "/Z7", "/G5", "/Ob1", "/Oi"]
# The unoptimized BASE units (FONT, WINDOW, RESMGR) start every function on a
# 16-byte boundary with int3 fill, exactly like the /O2 (implied /Gy) BASE
# units, whereas the /Od SOURCE objects are packed: function-level linking.
cpp_carcass_gy = ["/nologo", "/c", "/Od", "/Z7", "/G5", "/Ob1", "/Gy"]
cpp_carcass_oi_gy = ["/nologo", "/c", "/Od", "/Z7", "/G5", "/Ob1", "/Oi", "/Gy"]
cpp_o2 = ["/nologo", "/c", "/O2", "/Z7", "/G5"]
# Standalone DigitalReport/FadeScreen and expanded callers jointly require
# automatic inlining; see evidence/sound-volume-control.md and window-lifecycle.md.
cpp_o2_inline = ["/nologo", "/c", "/O2", "/Ob2", "/Z7", "/G5"]
cpp_codec = ["/nologo", "/c", "/O2", "/Ob2", "/Z7", "/G5"]

